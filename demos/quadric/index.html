<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GPU Ray-Casting of Quadratic Surfaces</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #0a0a0a;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    #loader {
      position: fixed; inset: 0;
      background: #0a0a0a;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: #aaa; font-family: system-ui, sans-serif;
      transition: opacity 0.5s;
      z-index: 10;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #333;
      border-top-color: #9a031e;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loader-status { font-size: 0.9rem; margin-bottom: 0.4rem; }
    #loader-hint { font-size: 0.75rem; color: #555; }
    .fs-btn {
      position: fixed; top: 0.6rem; right: 0.6rem;
      background: rgba(20,20,20,0.75); color: #bbb;
      border: 1px solid #444; border-radius: 4px;
      padding: 0.3rem 0.7rem; font-size: 0.75rem;
      cursor: pointer; font-family: system-ui, sans-serif;
      z-index: 20; transition: background 0.15s, color 0.15s;
      letter-spacing: 0.03em;
    }
    .fs-btn:hover { background: rgba(0,0,0,0.95); color: #fff; }
    #exit-fs-btn { display: none; }
    canvas { display: block; max-width: 100%; }
  </style>
</head>
<body>
  <div id="loader">
    <div class="spinner"></div>
    <div id="loader-status">Downloading…</div>
    <div id="loader-hint">~13 MB — first load may take a moment</div>
  </div>

  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

  <button id="enter-fs-btn" class="fs-btn" onclick="enterFullscreen()">⛶ Fullscreen</button>
  <button id="exit-fs-btn"  class="fs-btn" onclick="exitFullscreen()">✕ Exit Fullscreen</button>

  <script>
    var loaderEl  = document.getElementById('loader');
    var statusEl  = document.getElementById('loader-status');
    var canvasEl  = document.getElementById('canvas');

    function enterFullscreen() {
      var el = document.body;
      (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    }
    function exitFullscreen() {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    }
    function onFullscreenChange() {
      var inFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
      document.getElementById('enter-fs-btn').style.display = inFS ? 'none'  : 'block';
      document.getElementById('exit-fs-btn').style.display  = inFS ? 'block' : 'none';
    }
    document.addEventListener('fullscreenchange',       onFullscreenChange);
    document.addEventListener('webkitfullscreenchange', onFullscreenChange);

    canvasEl.addEventListener('webglcontextlost', (e) => { e.preventDefault(); }, false);

    var Module = {
      canvas: canvasEl,
      print:    (...args) => console.log(...args),
      printErr: (...args) => console.warn(...args),
      setStatus(text) {
        if (!Module.setStatus.last) Module.setStatus.last = '';
        if (text === Module.setStatus.last) return;
        Module.setStatus.last = text;
        if (!text) {
          loaderEl.classList.add('hidden');
          setTimeout(() => { loaderEl.style.display = 'none'; }, 600);
        } else {
          statusEl.textContent = text;
        }
      },
      totalDependencies: 0,
      monitorRunDependencies(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        this.setStatus(left
          ? 'Preparing… (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')'
          : '');
      }
    };
    Module.setStatus('Downloading…');
  </script>
  <script async src="QuadricRaycasterWeb.js"></script>
</body>
</html>
